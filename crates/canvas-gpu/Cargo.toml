[package]
name = "figcraft-canvas-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental retained GPU canvas for Lizard"

[lints]
workspace = true

[dependencies]
figcraft-doc = { workspace = true }
figcraft-color = { workspace = true }
figcraft-geom = { workspace = true }
figcraft-render = { workspace = true }
figcraft-shader = { workspace = true }
wgpu = "30.0.1"
rayon = "1"
pollster = "0.4"
vello_common = "0.3.0"
vello_gpu = { version = "0.3.0", default-features = false, features = ["wgpu", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
image = { workspace = true }
