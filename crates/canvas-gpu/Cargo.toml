[package]
name = "lizard-canvas-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental retained GPU canvas for Lizard"

[lints]
workspace = true

[dependencies]
lizard-doc = { workspace = true }
lizard-color = { workspace = true }
lizard-geom = { workspace = true }
lizard-render = { workspace = true }
lizard-shader = { workspace = true }
lizard-text = { workspace = true }
wgpu = "30.0.1"
rayon = "1"
pollster = "1.0"
vello_common = "0.3.0"
vello_gpu = { version = "0.3.0", default-features = false, features = ["wgpu", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
image = { workspace = true }
lizard-format = { workspace = true }
