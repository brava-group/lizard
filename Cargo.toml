[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The plugin SDK and examples build for wasm32 in a workspace of their own (`cargo xtask plugins`).
exclude = ["plugins", "vendor/egui-winit"]

[workspace.package]
version = "0.9.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
lizard-geom = { path = "crates/geom" }
lizard-color = { path = "crates/color" }
lizard-doc = { path = "crates/doc" }
lizard-layout = { path = "crates/layout" }
lizard-text = { path = "crates/text" }
lizard-pathops = { path = "crates/pathops" }
lizard-render = { path = "crates/render" }
lizard-canvas-gpu = { path = "crates/canvas-gpu" }
lizard-shader = { path = "crates/shader" }
lizard-svg = { path = "crates/svg" }
lizard-pdf = { path = "crates/pdf" }
lizard-format = { path = "crates/format" }
lizard-collab = { path = "crates/collab" }
lizard-engine = { path = "crates/engine" }
lizard-ui-egui = { path = "crates/ui-egui" }
workbench-ui = { path = "crates/workbench-ui" }
lizard-mcp = { path = "crates/mcp" }
lizard-collab-net = { path = "crates/collab-net" }
lizard-plugin = { path = "crates/plugin" }
lizard-figma-plugin = { path = "crates/figma-plugin" }

# Which paths stored in a document may be followed (craft-libs).
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
# Who draws the window frame on Linux — the compositor or the app — so every Craft app shows the
# same native titlebar per desktop (craft-libs). The `egui` feature adds `decorate`/`decorations`.
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "1f805378d454dac48b5c214029d254055fdf961b", features = ["egui"] }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1.13"
log = "0.4"
proptest = "1"
imbl = { version = "7", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# rendering / formats
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# Already built for `image`: embedded ICC profiles (moxcms) and PNG colour chunks (png).
moxcms = "0.9"
png = "0.18"
usvg = "0.49"
krilla = "0.8"
skrifa = "0.49"
harfrust = "0.15"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
linesweeper = "0.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
# `.fig` import: raw deflate chunks (already built for zip) and zstd chunks (pure Rust, MIT, wasm-safe).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.23"
crc32fast = "1"

# plugins: a pure-Rust, metered WebAssembly interpreter (no JIT; also runs in the web build). The
# portable dispatch loop: tail-call dispatch relies on an LLVM optimisation that unoptimised and
# debug builds may not do, and then a long-running plugin overflows the native stack.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
wat = "1.261"
boa_engine = { version = "0.22", default-features = false }

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# Pixel routines intentionally index neighboring samples.
needless_range_loop = "allow"
# Lizard never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4

# The browser build only (apps/lizard-web/index.html: data-cargo-profile). Optimised for size:
# packaging/web/package.sh fails a .wasm over 24 MiB (Cloudflare's per-file cap is 25 MiB).
# wasm32-unknown-unknown always aborts on panic, so panic = "abort" changes nothing there.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"

# egui-winit 0.36.2 drops Cmd+V when the clipboard holds only an image.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
