[package]
name = "lizard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Lizard desktop app"
default-run = "lizard"

[[bin]]
name = "lizard"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lizard-engine = { workspace = true }
lizard-figma-plugin = { workspace = true }
lizard-ui-egui = { workspace = true }
lizard-collab-net = { workspace = true }
lizard-format = { workspace = true }
lizard-text = { workspace = true }
# Shared decision of who draws the window frame on Linux (compositor vs. app), replacing the
# bespoke Wayland xdg-decoration probe.
craft-window = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
semver = "1"
log = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data", "wayland-data-control"] }
webbrowser = { workspace = true }
image = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lizard-mcp = { workspace = true }
lizard-canvas-gpu = { workspace = true }
lizard-color = { workspace = true }
lizard-doc = { workspace = true }
lizard-geom = { workspace = true }
lizard-render = { workspace = true }

# The system's reduce-motion setting (UISettings.AnimationsEnabled), interface language
# (GlobalizationPreferences.Languages) and controllers for prototypes (Gaming.Input.Gamepad).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement", "System_UserProfile", "Foundation_Collections", "Gaming_Input"] }

# Finder double-clicks, Open With, Dock drops and `open -a Lizard file.lzd` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This crate (also used by GridCraft,
# EffectCraft and PhotoCraft) registers the handler behind a safe API (Objective-C interop needs
# unsafe, which the workspace forbids). Pinned exactly: review the diff before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
fmv-macos-events = "=0.1.0"
wry = { version = "0.57", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"

[dev-dependencies]
wat = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Use vector window controls without a title-font renderer or embedded Cantarell. The compositor
# probe that used to need raw-window-handle and wayland-client here now lives in craft-window.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"] }
