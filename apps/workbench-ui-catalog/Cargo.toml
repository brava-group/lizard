[package]
name = "workbench-ui-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Standalone native UI component catalog for local development"

[[bin]]
name = "workbench-ui-catalog"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lizard-ui-egui = { workspace = true, features = ["catalog"] }
workbench-ui = { workspace = true }
lizard-engine = { workspace = true }
lizard-doc = { workspace = true }
lizard-color = { workspace = true }
lizard-text = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde_json = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
