[package]
name = "lizard-web"
description = "Lizard in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "lizard-web"
path = "src/main.rs"

[dependencies]
lizard-engine = { workspace = true }
lizard-ui-egui = { workspace = true }
lizard-collab-net = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
lizard-canvas-gpu = { workspace = true }
lizard-color = { workspace = true }
lizard-doc = { workspace = true }
lizard-geom = { workspace = true }
lizard-render = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "Node", "Blob", "BlobPropertyBag", "File", "FileList", "Url", "Location", "MediaQueryList", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "ClipboardEvent", "DataTransfer", "EventTarget"] }
