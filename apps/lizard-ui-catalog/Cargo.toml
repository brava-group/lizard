[package]
name = "lizard-ui-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Standalone native UI component catalog for local development"

[[bin]]
name = "lizard-ui-catalog"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
figcraft-ui-egui = { workspace = true, features = ["catalog"] }
figcraft-engine = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-color = { workspace = true }
figcraft-text = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde_json = { workspace = true }
image = { workspace = true }
